<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Tema antes de pintar la página (evita el parpadeo blanco en modo oscuro)
    try {
      document.documentElement.setAttribute("data-bs-theme",
        localStorage.getItem("tema") ||
        (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
    } catch (e) {}
  </script>
  <title>Farmacia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/estilos.css" rel="stylesheet">
</head>
<body>
  <!-- ===================== Menú lateral ===================== -->
  <aside class="menu-lateral" id="menu-lateral">
    <div class="menu-marca">
      <div class="icono-marca"><i class="bi bi-capsule-pill"></i></div>
      <span class="texto-menu" id="nombre-negocio">Farmacia</span>
    </div>

    <div class="menu-perfil">
      <div class="avatar" id="avatar">--</div>
      <div class="nombre" id="perfil-nombre">Cargando...</div>
      <div class="rol" id="perfil-rol"></div>
    </div>

    <nav class="menu-navegacion" id="menu-navegacion"></nav>

    <div class="menu-pie">
      <a href="#" class="menu-enlace" id="cerrar-sesion" title="Cerrar sesión">
        <i class="bi bi-box-arrow-left"></i><span class="texto-menu">Cerrar sesión</span>
      </a>
    </div>
  </aside>
  <div class="fondo-menu" id="fondo-menu"></div>

  <!-- ===================== Contenido ===================== -->
  <main class="contenido">
    <header class="barra-superior">
      <button class="btn btn-vidrio btn-icono" id="boton-menu" title="Abrir o cerrar menú">
        <i class="bi bi-list fs-5"></i>
      </button>
      <h1 class="titulo-pagina" id="titulo-pagina">Panel</h1>
      <button class="btn btn-vidrio btn-icono ms-auto" data-boton-tema></button>
      <div class="reloj d-none d-sm-block">
        <div class="hora" id="reloj-hora">--:--</div>
        <div class="fecha" id="reloj-fecha"></div>
      </div>
    </header>

    <section id="vista"></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/tabla.js"></script>
  <script src="/js/formulario.js"></script>
  <script src="/js/app.js"></script>
  <!-- Módulos -->
  <script src="/js/modulos/panel.js"></script>
  <script src="/js/modulos/catalogos.js"></script>
  <script src="/js/modulos/clientes.js"></script>
  <script src="/js/modulos/proveedores.js"></script>
  <script src="/js/modulos/empleados.js"></script>
  <script src="/js/modulos/ubicaciones.js"></script>
  <script src="/js/modulos/configuracion.js"></script>
  <script src="/js/modulos/bitacora.js"></script>
  <script src="/js/modulos/existencias.js"></script>
  <script src="/js/modulos/productos.js"></script>
  <script src="/js/modulos/usuarios.js"></script>
  <script src="/js/modulos/movimientos.js"></script>
  <script src="/js/modulos/caja.js"></script>
  <script src="/js/modulos/ventas.js"></script>
</body>
</html>
