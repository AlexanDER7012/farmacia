<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Tema antes de pintar la página (evita el parpadeo blanco en modo oscuro)
    try {
      document.documentElement.setAttribute("data-bs-theme",
        localStorage.getItem("tema") ||
        (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
    } catch (e) {}
  </script>
  <title>Iniciar sesión | Farmacia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/estilos.css" rel="stylesheet">
</head>
<body>
  <main class="pantalla-login">
    <section class="tarjeta-login">
      <button type="button" class="btn btn-vidrio btn-icono boton-tema-login" data-boton-tema></button>

      <div class="text-center mb-4">
        <div class="logo-login"><i class="bi bi-capsule-pill"></i></div>
        <h1 class="titulo-login">Bienvenido a <span class="resaltado">Farmacia</span></h1>
        <p class="subtitulo-login mb-0">Sistema de Gestión - Inventario, Compras y Ventas</p>
      </div>

      <div id="aviso-sesion" class="alert alert-warning rounded-4 d-none" role="alert"></div>

      <form id="form-login" novalidate>
        <div class="alert alert-danger rounded-4 error-general d-none" role="alert"></div>

        <div class="mb-3">
          <label for="nombre_usuario" class="form-label"><i class="bi bi-person-fill"></i>Usuario</label>
          <div class="campo-pill">
            <i class="bi bi-person icono-izq"></i>
            <input type="text" class="form-control" id="nombre_usuario" name="nombre_usuario"
                   placeholder="Ingresa tu usuario" autocomplete="username" autofocus required>
          </div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label"><i class="bi bi-lock-fill"></i>Contraseña</label>
          <div class="campo-pill">
            <i class="bi bi-lock icono-izq"></i>
            <input type="password" class="form-control" id="password" name="password"
                   placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
            <button class="boton-der" type="button" id="ver-password" title="Mostrar contraseña">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-login w-100" id="boton-entrar">
          <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
        </button>
      </form>

      <p class="version-login text-center mt-4 mb-0"><i class="bi bi-code-slash me-1"></i>v1.0.0</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    const form = document.getElementById("form-login");
    const boton = document.getElementById("boton-entrar");

    UI.tema.preparar();

    // Si ya tiene sesión, directo al sistema
    API.get("/api/auth/me").then(() => location.replace("/index.html")).catch(() => {});

    // Aviso si llegó aquí porque la sesión venció
    if (new URLSearchParams(location.search).has("expirada")) {
      const aviso = document.getElementById("aviso-sesion");
      aviso.textContent = "Tu sesión expiró por inactividad. Inicia sesión de nuevo.";
      aviso.classList.remove("d-none");
    }

    // Mostrar u ocultar la contraseña
    document.getElementById("ver-password").addEventListener("click", (e) => {
      const campo = document.getElementById("password");
      const visible = campo.type === "text";
      campo.type = visible ? "password" : "text";
      e.currentTarget.innerHTML = `<i class="bi bi-eye${visible ? "" : "-slash"}"></i>`;
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      UI.limpiarErrores(form);

      const datos = UI.leerFormulario(form);
      if (!datos.nombre_usuario || !datos.password) {
        UI.mostrarErrores(form, { message: "Escribe tu usuario y contraseña" });
        return;
      }

      UI.cargando(boton, true, "Ingresando...");
      try {
        await API.post("/api/auth/login", datos);
        location.replace("/index.html");
      } catch (error) {
        form.password.value = "";
        UI.mostrarErrores(form, { message: error.message });
        UI.cargando(boton, false);
      }
    });
  </script>
</body>
</html>
